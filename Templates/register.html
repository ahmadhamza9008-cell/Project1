<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Comfort - Register</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='register.css') }}">
</head>
<body>
    <nav>
        <a href="{{ url_for('index') }}">Home</a>
        <a href="{{ url_for('about') }}">About</a>
        <a href="{{ url_for('contact') }}">Contact</a>
        <a href="{{ url_for('houses') }}">Houses</a>
    </nav>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <form method="post" action="{{ url_for('register') }}">
        <label for="fullname">Full Name</label><br>
        <input type="text" id="fullname" name="fullname" placeholder="Full Name" required><br>

        <label for="email">Email</label><br>
        <input type="email" id="email" name="email" placeholder="Enter email" required><br>

        <label for="password">Password</label><br>
        <input type="password" id="password" name="password" placeholder="Enter password" required><br>

        <button id="submit" type="submit">Register</button><br>

        Already have an account? <a href="{{ url_for('login') }}">Login</a><br>
        <br>
        Continue with Google? <a href="#">Google</a>
    </form>

    <footer>
        &copy; Student Comfort - 2025 All Rights Reserved.
    </footer>
</body>
</html>
